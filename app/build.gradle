plugins { id 'com.android.application' }

android {
    namespace 'pl.krzysiek.assistant'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.krzysiek.assistant'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2-reminders'
        // Uzupełnij adresem własnego backendu, np. https://assistant.twojadomena.pl
        buildConfigField 'String', 'AI_BASE_URL', '"https://YOUR_BACKEND"'
    }
    buildFeatures { buildConfig true }
}
