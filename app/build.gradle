plugins { id 'com.android.application' }
android {
    namespace 'pl.krzysiek.assistant'
    compileSdk 36
    defaultConfig {
        applicationId 'pl.krzysiek.assistant'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.4-premium'
        buildConfigField 'String', 'AI_BASE_URL', '"https://YOUR_BACKEND"'
    }
    buildFeatures { buildConfig true }
}
